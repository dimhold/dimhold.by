<!doctype html>
<meta charset="utf-8" />
<title>Прагулка — Мітя і Зум</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f2ebe0;
    --surface: #fbf6ee;
    --ink: #2e2519;
    --muted: #7a6a55;
    --line: #ded0bb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  .row {
    width: min(100%, 64rem);
    display: flex;
    gap: 0.9rem;
    align-items: stretch;
  }
  .gauges {
    flex: 0 0 6.2rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0.7rem 0.4rem 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .gauge-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-align: center;
  }
  .gauges svg { flex: 1; }
  .profile {
    width: min(100%, 64rem);
    height: 8rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .profile svg { width: 100%; height: 100%; display: block; }
  .stage {
    flex: 1;
    min-width: 0;
    /* The walk decides the shape of its own box: a long thin ramble squeezed
       into 4:3 wastes most of the frame and shrinks the interesting part. */
    aspect-ratio: var(--aspect, 4 / 3);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(74, 58, 38, 0.09);
  }
  svg { width: 100%; height: 100%; display: block; }
  .trail { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .panel {
    width: min(100%, 60rem);
    display: flex;
    gap: 0.6rem;
    align-items: center;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    padding: 0.42rem 1rem;
    border-radius: 999px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
  }
  button.primary { background: var(--ink); color: var(--surface); border-color: transparent; }
  input[type='range'] { flex: 1 1 12rem; }
  .readout { display: flex; gap: 1rem; flex-wrap: wrap; width: min(100%, 60rem); }
  .card {
    flex: 1 1 12rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0.7rem 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }
  .card img { width: 42px; height: 42px; border-radius: 50%; }
  .card b { font-variant-numeric: tabular-nums; font-size: 1.35rem; font-weight: 600; }
  .card span { display: block; font-size: 0.78rem; color: var(--muted); }
  .gap { text-align: center; font-size: 0.88rem; color: var(--muted); width: min(100%, 60rem); margin: 0; }
  .gap b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.85rem; min-width: 4rem; }
</style>

<h1>Адна прагулка, два трэкі</h1>

<div class="row">
  <div class="stage"><svg id="map" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div class="gauges">
    <div class="gauge-title">вышыня</div>
    <svg id="alt" preserveAspectRatio="none" viewBox="0 0 100 400"></svg>
  </div>
  <div class="gauges">
    <div class="gauge-title">хуткасць</div>
    <svg id="spd" preserveAspectRatio="none" viewBox="0 0 100 400"></svg>
  </div>
</div>

<div class="profile"><svg id="prof" preserveAspectRatio="none" viewBox="0 0 1000 160"></svg></div>

<div class="panel">
  <button id="play" class="primary">Пуск</button>
  <input type="range" id="scrub" min="0" value="0" step="1" />
  <span class="clock" id="clock">00:00</span>
  <button data-rate="30">30×</button>
  <button data-rate="90" class="primary">90×</button>
  <button data-rate="240">240×</button>
</div>

<div class="readout" id="cards"></div>
<p class="gap">
  Зум прайшоў на <b id="delta">0</b> больш — <b id="pct">0%</b>. Адлегласць паміж імі:
  <b id="sep">0 м</b>.
</p>

<script>
  /* Injected by scripts/gen-walk-prototype.mjs. Coordinates are metres on a
     local plane, taken from the anonymised tracks — the real place is not in
     this file. */
  const DATA = __DATA__;

  const NS = 'http://www.w3.org/2000/svg';
  const keys = Object.keys(DATA.tracks);

  /* One box that holds both walks, with room for the markers at the edges. */
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const k of keys) {
    const t = DATA.tracks[k];
    for (let i = 0; i < t.x.length; i++) {
      if (t.x[i] < minX) minX = t.x[i];
      if (t.x[i] > maxX) maxX = t.x[i];
      if (t.y[i] < minY) minY = t.y[i];
      if (t.y[i] > maxY) maxY = t.y[i];
    }
  }
  const PAD = 45;
  const W = maxX - minX + PAD * 2;
  const H = maxY - minY + PAD * 2;
  const map = document.getElementById('map');
  map.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

  const px = (x) => x - minX + PAD;
  /* SVG grows downward and north does not, so the flip happens once, here. */
  const py = (y) => H - (y - minY + PAD);

  function el(name, attrs) {
    const n = document.createElementNS(NS, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  function pathOf(t, upto) {
    let d = '';
    for (let i = 0; i <= upto; i++) d += (i ? 'L' : 'M') + px(t.x[i]).toFixed(1) + ' ' + py(t.y[i]).toFixed(1);
    return d;
  }

  document.querySelector('.stage').style.setProperty('--aspect', W + ' / ' + H);

  /* Everything on the map is measured in metres, so a fixed pixel size would be
     meaningless — a 56-unit marker on a six-kilometre walk is a 56-metre head.
     Sizes scale with the extent instead. */
  const UNIT = Math.max(W, H) / 100;
  const MARKER = UNIT * 3.4;

  const parts = {};
  for (const k of keys) {
    const t = DATA.tracks[k];
    const trail = el('path', { d: '', class: 'trail', stroke: t.colour, 'stroke-width': UNIT * 0.62 });
    map.appendChild(trail);
    parts[k] = { trail: trail };
  }

  /* The two of them are rarely more than fifty metres apart, so at this scale
     the faces sit on top of each other. The tether between them is what makes
     the ranging-out-and-coming-back legible at all. */
  const tether = el('line', { stroke: 'var(--muted)', 'stroke-width': UNIT * 0.22, 'stroke-dasharray': UNIT * 0.5 + ' ' + UNIT * 0.5, opacity: 0.75 });
  map.appendChild(tether);

  for (const k of keys) {
    const t = DATA.tracks[k];
    const ring = el('circle', { r: MARKER / 2 + UNIT * 0.28, fill: 'none', stroke: t.colour, 'stroke-width': UNIT * 0.4, cx: -999, cy: -999 });
    const marker = el('image', { href: t.face, width: MARKER, height: MARKER, x: -999, y: -999 });
    map.appendChild(marker);
    map.appendChild(ring);
    parts[k].marker = marker;
    parts[k].ring = ring;
  }

  const cards = document.getElementById('cards');
  for (const k of keys) {
    const t = DATA.tracks[k];
    const div = document.createElement('div');
    div.className = 'card';
    const img = document.createElement('img');
    img.src = t.face;
    img.alt = '';
    const box = document.createElement('div');
    const b = document.createElement('b');
    b.id = 'km-' + k;
    b.textContent = '0.00';
    const span = document.createElement('span');
    span.textContent = t.label;
    box.append(b, document.createTextNode(' км'), span);
    div.append(img, box);
    cards.appendChild(div);
  }

  /* ── the two gauge columns ───────────────────────────────────────────────
     Height and speed, each read off the same series the map is drawn from.
     Both share ONE scale across the two walkers: separate scales would let a
     two-metre wobble look like a hill, and a stroll look like a sprint. */
  function extent(field) {
    let lo = Infinity, hi = -Infinity;
    for (const k of keys) {
      for (const v of DATA.tracks[k][field]) {
        if (v < lo) lo = v;
        if (v > hi) hi = v;
      }
    }
    return [lo, Math.max(hi, lo + 1)];
  }

  const AW = 100, AH = 400, ATOP = 22, ABOT = 26, KNOB = 30;

  function buildGauge(svgId, field, lo, hi, top) {
    const svg = document.getElementById(svgId);
    const y = (v) => AH - ABOT - ((v - lo) / (hi - lo)) * (AH - ATOP - ABOT);
    const parts = {};
    keys.forEach((k, n) => {
      const t = DATA.tracks[k];
      const cx = AW * (n === 0 ? 0.3 : 0.7);
      svg.appendChild(el('line', { x1: cx, x2: cx, y1: ATOP, y2: AH - ABOT, stroke: 'var(--line)', 'stroke-width': 9, 'stroke-linecap': 'round' }));
      const fill = el('line', { x1: cx, x2: cx, y1: AH - ABOT, y2: AH - ABOT, stroke: t.colour, 'stroke-width': 9, 'stroke-linecap': 'round', opacity: 0.35 });
      svg.appendChild(fill);
      /* The same face as on the map. A coloured dot would make the reader hold
         a legend in their head; the face is the legend. */
      const knob = el('image', { href: t.face, width: KNOB, height: KNOB, x: cx - KNOB / 2, y: AH - ABOT - KNOB / 2 });
      const ring = el('circle', { cx: cx, r: KNOB / 2 + 1.5, cy: AH - ABOT, fill: 'none', stroke: t.colour, 'stroke-width': 3 });
      svg.appendChild(knob);
      svg.appendChild(ring);
      const label = el('text', { x: cx, y: AH - 8, 'text-anchor': 'middle', fill: 'var(--muted)', 'font-size': 13 });
      svg.appendChild(label);
      parts[k] = { fill: fill, knob: knob, ring: ring, label: label };
    });
    const cap = el('text', { x: AW / 2, y: 13, 'text-anchor': 'middle', fill: 'var(--muted)', 'font-size': 12 });
    cap.textContent = top;
    svg.appendChild(cap);
    return { y: y, parts: parts };
  }

  /* Heights read from the bottom of the walk, not from the sea: the anonymised
     tracks are rebased so the lowest point of the wood is zero. */
  const [eLo, eHi] = extent('e');
  const altG = buildGauge('alt', 'e', eLo, eHi, '+' + (eHi - eLo).toFixed(0) + ' м');
  /* Speed is capped at the fastest thing either of them did, rounded up, so the
     bar has a round number at the top rather than 24.63. */
  const vTop = Math.ceil(extent('v')[1] / 5) * 5;
  const spdG = buildGauge('spd', 'v', 0, vTop, vTop + ' км/г');

  /* The profile is drawn against wall-clock seconds rather than distance —
     the whole point is that at the same instant they were at different heights. */
  const prof = document.getElementById('prof');
  const PW = 1000, PH = 160, PPAD = 10;
  const pxT = (sec) => (sec / DATA.seconds) * PW;
  const pyE = (v) => PH - PPAD - ((v - eLo) / (eHi - eLo)) * (PH - PPAD * 2);

  for (const k of keys) {
    const t = DATA.tracks[k];
    let d = '';
    /* One point per second is far more than a 1000-unit-wide strip can show;
       every eighth keeps the shape and cuts the path to a sane length. */
    for (let i = 0; i < t.s.length; i += 8) d += (d ? 'L' : 'M') + pxT(t.s[i]).toFixed(1) + ' ' + pyE(t.e[i]).toFixed(1);
    prof.appendChild(el('path', { d: d, fill: 'none', stroke: t.colour, 'stroke-width': 2, 'stroke-linejoin': 'round', opacity: 0.85 }));
  }
  const playhead = el('line', { y1: 0, y2: PH, stroke: 'var(--ink)', 'stroke-width': 1.5, opacity: 0.5, x1: 0, x2: 0 });
  prof.appendChild(playhead);

  function setGauge(g, k, value, text) {
    const p = g.parts[k];
    p.fill.setAttribute('y2', g.y(value));
    p.knob.setAttribute('y', g.y(value) - KNOB / 2);
    p.ring.setAttribute('cy', g.y(value));
    p.label.textContent = text;
  }

  function renderGauges(sec, pos) {
    for (const k of keys) {
      setGauge(altG, k, pos[k].e, '+' + (pos[k].e - eLo).toFixed(0));
      setGauge(spdG, k, Math.min(pos[k].v, vTop), pos[k].v.toFixed(1));
    }
    playhead.setAttribute('x1', pxT(sec));
    playhead.setAttribute('x2', pxT(sec));
  }

  /** Index of the last sample at or before the given second. */
  function at(t, sec) {
    let lo = 0, hi = t.s.length - 1;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (t.s[mid] <= sec) lo = mid; else hi = mid - 1;
    }
    return lo;
  }

  function render(sec) {
    const pos = {};
    for (const k of keys) {
      const t = DATA.tracks[k];
      const i = at(t, sec);
      parts[k].trail.setAttribute('d', pathOf(t, i));
      const cx = px(t.x[i]);
      const cy = py(t.y[i]);
      parts[k].marker.setAttribute('x', cx - MARKER / 2);
      parts[k].marker.setAttribute('y', cy - MARKER / 2);
      parts[k].ring.setAttribute('cx', cx);
      parts[k].ring.setAttribute('cy', cy);
      document.getElementById('km-' + k).textContent = (t.d[i] / 1000).toFixed(2);
      pos[k] = { x: t.x[i], y: t.y[i], d: t.d[i], e: t.e[i], v: t.v[i] };
    }
    renderGauges(sec, pos);

    tether.setAttribute('x1', px(pos.mitya.x));
    tether.setAttribute('y1', py(pos.mitya.y));
    tether.setAttribute('x2', px(pos.zoom.x));
    tether.setAttribute('y2', py(pos.zoom.y));

    const gap = pos.zoom.d - pos.mitya.d;
    document.getElementById('delta').textContent = gap >= 1000 ? (gap / 1000).toFixed(2) + ' км' : gap + ' м';
    document.getElementById('pct').textContent = pos.mitya.d ? ((gap / pos.mitya.d) * 100).toFixed(1) + '%' : '0%';
    document.getElementById('sep').textContent =
      Math.round(Math.hypot(pos.zoom.x - pos.mitya.x, pos.zoom.y - pos.mitya.y)) + ' м';
    document.getElementById('clock').textContent =
      String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
  }

  const scrub = document.getElementById('scrub');
  const play = document.getElementById('play');
  scrub.max = DATA.seconds;

  let sec = 0, rate = 90, frame = null, last;

  function tick(now) {
    if (last === undefined) last = now;
    sec += ((now - last) / 1000) * rate;
    last = now;
    if (sec >= DATA.seconds) { sec = DATA.seconds; stop(); }
    scrub.value = Math.round(sec);
    render(Math.round(sec));
    if (frame !== null) frame = requestAnimationFrame(tick);
  }
  function start() {
    if (sec >= DATA.seconds) sec = 0;
    last = undefined;
    play.textContent = 'Стоп';
    frame = requestAnimationFrame(tick);
  }
  function stop() {
    if (frame !== null) cancelAnimationFrame(frame);
    frame = null;
    play.textContent = 'Пуск';
  }

  play.addEventListener('click', () => (frame === null ? start() : stop()));
  scrub.addEventListener('input', () => { sec = +scrub.value; render(sec); });
  for (const b of document.querySelectorAll('[data-rate]')) {
    b.addEventListener('click', () => {
      rate = +b.dataset.rate;
      for (const o of document.querySelectorAll('[data-rate]')) o.classList.toggle('primary', o === b);
    });
  }

  render(0);
</script>
